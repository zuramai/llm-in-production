<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="14" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Incident analysis agent: what watches what</text>

  <!-- telemetry plane -->
  <rect x="24" y="56" width="440" height="440" rx="10" fill="#f4f6fa" stroke="#b8c2d6"/>
  <text x="44" y="82" font-size="14" font-weight="bold" fill="#33415c">Telemetry plane (docker compose)</text>

  <rect x="48" y="110" width="170" height="86" rx="8" fill="#9ec5fe" stroke="#4a78c2"/>
  <text x="133" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#10243f">checkout</text>
  <text x="133" y="160" text-anchor="middle" font-size="12" fill="#10243f">FastAPI :8011</text>
  <text x="133" y="178" text-anchor="middle" font-size="12" fill="#10243f">sim DB pool + providers</text>

  <rect x="270" y="110" width="170" height="60" rx="8" fill="#ffd59e" stroke="#c28a3a"/>
  <text x="355" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d2a0a">Prometheus :9091</text>
  <text x="355" y="156" text-anchor="middle" font-size="12" fill="#3d2a0a">scrapes /metrics every 5 s</text>

  <rect x="270" y="210" width="170" height="60" rx="8" fill="#b8e0b0" stroke="#4f8f45"/>
  <text x="355" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#14300f">Loki :3101</text>
  <text x="355" y="256" text-anchor="middle" font-size="12" fill="#14300f">JSON logs via push API</text>

  <rect x="270" y="330" width="170" height="60" rx="8" fill="#e3c4f0" stroke="#8a5aa3"/>
  <text x="355" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d1238">Grafana :3011</text>
  <text x="355" y="376" text-anchor="middle" font-size="12" fill="#2d1238">Checkout Overview</text>

  <rect x="48" y="330" width="170" height="60" rx="8" fill="#eeeeee" stroke="#999"/>
  <text x="133" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">loadgen.py</text>
  <text x="133" y="376" text-anchor="middle" font-size="12" fill="#222">inject_fault.py</text>

  <line x1="218" y1="130" x2="268" y2="135" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="243" y="122" text-anchor="middle" font-size="10" fill="#555">pull</text>
  <line x1="190" y1="196" x2="268" y2="236" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="212" y="226" text-anchor="middle" font-size="10" fill="#555">push</text>
  <line x1="133" y1="330" x2="133" y2="198" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="108" y="270" text-anchor="middle" font-size="10" fill="#555">traffic,</text>
  <text x="108" y="283" text-anchor="middle" font-size="10" fill="#555">faults</text>
  <line x1="355" y1="170" x2="355" y2="328" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="420" y1="270" x2="420" y2="328" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="240" y="440" text-anchor="middle" font-size="12" fill="#444">A human looks at Grafana. The agent calls the same APIs.</text>

  <!-- agent plane -->
  <rect x="496" y="56" width="440" height="440" rx="10" fill="#fbf6ee" stroke="#d9c7a3"/>
  <text x="516" y="82" font-size="14" font-weight="bold" fill="#5c4a21">Agent plane (read-only)</text>

  <rect x="520" y="104" width="392" height="76" rx="8" fill="#ffe08a" stroke="#c9a227"/>
  <text x="716" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d3008">Tool loop (max 8 steps)</text>
  <text x="716" y="150" text-anchor="middle" font-size="12" fill="#3d3008">LLM picks a tool, sees a SUMMARY of the result,</text>
  <text x="716" y="166" text-anchor="middle" font-size="12" fill="#3d3008">tests one hypothesis at a time</text>

  <g font-size="12" fill="#222">
    <rect x="520" y="210" width="186" height="46" rx="6" fill="#ffd59e" stroke="#c28a3a"/>
    <text x="613" y="230" text-anchor="middle" font-weight="bold">query_prometheus</text>
    <text x="613" y="246" text-anchor="middle" font-size="11">PromQL, range</text>
    <rect x="726" y="210" width="186" height="46" rx="6" fill="#b8e0b0" stroke="#4f8f45"/>
    <text x="819" y="230" text-anchor="middle" font-weight="bold">query_loki</text>
    <text x="819" y="246" text-anchor="middle" font-size="11">LogQL, grouped counts</text>
    <rect x="520" y="272" width="186" height="46" rx="6" fill="#d6d6d6" stroke="#888"/>
    <text x="613" y="292" text-anchor="middle" font-weight="bold">get_deploys</text>
    <text x="613" y="308" text-anchor="middle" font-size="11">deploys.json</text>
    <rect x="726" y="272" width="186" height="46" rx="6" fill="#d6d6d6" stroke="#888"/>
    <text x="819" y="292" text-anchor="middle" font-weight="bold">search_runbooks</text>
    <text x="819" y="308" text-anchor="middle" font-size="11">runbooks + handbook</text>
  </g>

  <line x1="716" y1="180" x2="716" y2="208" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="716" y1="318" x2="716" y2="352" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <rect x="520" y="354" width="392" height="56" rx="8" fill="#ffe08a" stroke="#c9a227"/>
  <text x="716" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d3008">Report call (strict JSON schema)</text>
  <text x="716" y="396" text-anchor="middle" font-size="12" fill="#3d3008">IncidentReport: hypotheses ranked by confidence</text>

  <rect x="520" y="430" width="392" height="46" rx="8" fill="#f4b6b6" stroke="#b34a4a"/>
  <text x="716" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a1010">Markdown postmortem → human decides</text>
  <text x="716" y="466" text-anchor="middle" font-size="12" fill="#3a1010">proposed actions only, never executed by the agent</text>
  <line x1="716" y1="410" x2="716" y2="428" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <line x1="466" y1="140" x2="518" y2="232" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="466" y1="240" x2="724" y2="236" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
