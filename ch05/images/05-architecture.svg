<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <title>ShopFlow agentic RAG: one question, two evidence sources, one graded and cited answer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" rx="16" fill="#ffffff"/>

  <!-- question -->
  <rect x="30" y="30" width="250" height="70" rx="10" fill="#d9e2f3" stroke="#6b7fa8"/>
  <text x="155" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a44">Support agent</text>
  <text x="155" y="80" text-anchor="middle" font-size="12" fill="#1f2a44">"Can customer 4860 still</text>
  <text x="155" y="94" text-anchor="middle" font-size="12" fill="#1f2a44">return order 21461?"</text>

  <!-- graph frame -->
  <rect x="320" y="20" width="620" height="520" rx="14" fill="#f6f7f9" stroke="#888" stroke-dasharray="6 4"/>
  <text x="340" y="44" font-size="13" font-weight="bold" fill="#333">LangGraph StateGraph (ch05_agentic/graph.py)</text>

  <!-- route -->
  <rect x="520" y="60" width="220" height="56" rx="10" fill="#f6d8a8" stroke="#b9853a"/>
  <text x="630" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d2a0c">route</text>
  <text x="630" y="103" text-anchor="middle" font-size="12" fill="#3d2a0c">LLM: doc_query? sql_question?</text>

  <!-- retrieve -->
  <rect x="350" y="170" width="250" height="110" rx="10" fill="#cfe8d5" stroke="#4f8a5d"/>
  <text x="475" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#173a20">retrieve (Chapter 4)</text>
  <text x="475" y="218" text-anchor="middle" font-size="12" fill="#173a20">pgvector + full-text, fused (RRF)</text>
  <text x="475" y="236" text-anchor="middle" font-size="12" fill="#173a20">cross-encoder rerank, top 4</text>
  <text x="475" y="262" text-anchor="middle" font-size="12" font-style="italic" fill="#173a20">→ [doc:policies/returns-policy.md#8]</text>

  <!-- sql -->
  <rect x="660" y="170" width="260" height="110" rx="10" fill="#cfe8d5" stroke="#4f8a5d"/>
  <text x="790" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#173a20">sql (Chapter 6)</text>
  <text x="790" y="218" text-anchor="middle" font-size="12" fill="#173a20">LLM writes SELECT → sqlglot guard</text>
  <text x="790" y="236" text-anchor="middle" font-size="12" fill="#173a20">→ shopflow_ro (read-only, 5 s)</text>
  <text x="790" y="262" text-anchor="middle" font-size="12" font-style="italic" fill="#173a20">→ [sql:1] delivered 2026-09-21</text>

  <text x="635" y="155" text-anchor="middle" font-size="12" fill="#555">in parallel, same superstep</text>

  <!-- grade -->
  <rect x="520" y="330" width="220" height="56" rx="10" fill="#f6d8a8" stroke="#b9853a"/>
  <text x="630" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d2a0c">grade</text>
  <text x="630" y="373" text-anchor="middle" font-size="12" fill="#3d2a0c">LLM: relevant? sufficient?</text>

  <!-- rewrite -->
  <rect x="350" y="420" width="200" height="56" rx="10" fill="#f3c9c4" stroke="#a65a50"/>
  <text x="450" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a1a14">rewrite</text>
  <text x="450" y="463" text-anchor="middle" font-size="12" fill="#4a1a14">new queries, max 2 loops</text>

  <!-- answer -->
  <rect x="700" y="420" width="220" height="56" rx="10" fill="#d9e2f3" stroke="#6b7fa8"/>
  <text x="810" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a44">answer</text>
  <text x="810" y="463" text-anchor="middle" font-size="12" fill="#1f2a44">cited, then citations checked</text>

  <!-- checkpointer -->
  <rect x="350" y="496" width="570" height="32" rx="8" fill="#e4dcef" stroke="#7d6a99"/>
  <text x="635" y="517" text-anchor="middle" font-size="12" fill="#2d2240">checkpointer: the state is saved after every superstep (resume, replay, inspect)</text>

  <!-- data stores -->
  <rect x="30" y="170" width="250" height="110" rx="10" fill="#eeeeee" stroke="#888"/>
  <text x="155" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ShopFlow Postgres 18</text>
  <text x="155" y="218" text-anchor="middle" font-size="12" fill="#222">ch05_doc_chunks: 36 docs,</text>
  <text x="155" y="234" text-anchor="middle" font-size="12" fill="#222">316 chunks, 768-d vectors</text>
  <text x="155" y="256" text-anchor="middle" font-size="12" fill="#222">orders, shipments, payments ...</text>
  <rect x="30" y="330" width="250" height="56" rx="10" fill="#eeeeee" stroke="#888"/>
  <text x="155" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Ollama (RTX 3090)</text>
  <text x="155" y="373" text-anchor="middle" font-size="12" fill="#222">nomic-embed-text, local LLMs</text>

  <!-- edges -->
  <path d="M280,65 L520,85" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M600,116 L500,170" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M660,116 L760,170" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M475,280 L590,330" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M790,280 L680,330" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M560,386 L480,420" stroke="#a65a50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="470" y="405" font-size="12" fill="#a65a50">insufficient</text>
  <path d="M700,386 L780,420" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="755" y="405" font-size="12" fill="#555">sufficient or 2 loops</text>
  <path d="M390,420 L390,282" stroke="#a65a50" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="384" y="305" text-anchor="end" font-size="12" fill="#a65a50">retry the</text>
  <text x="384" y="320" text-anchor="end" font-size="12" fill="#a65a50">tools</text>
  <path d="M280,225 L350,225" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <path d="M280,250 C450,300 600,300 660,255" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
</svg>
