<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="430" rx="12" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Disaggregated prefill / decode</text>

  <!-- Before -->
  <text x="20" y="60" font-size="14" font-weight="bold" fill="#1f2937">Together: one GPU does both jobs</text>
  <g stroke="#1f2937">
    <rect x="20" y="72" width="330" height="76" rx="8" fill="#e5e7eb"/>
    <rect x="34" y="88" width="120" height="44" rx="6" fill="#fbbf24"/>
    <rect x="164" y="88" width="170" height="44" rx="6" fill="#34d399"/>
  </g>
  <g fill="#111827" text-anchor="middle" font-size="12">
    <text x="94" y="108">prefill: long prompt,</text><text x="94" y="123">compute-bound</text>
    <text x="249" y="108">decode: 1 token / step,</text><text x="249" y="123">memory-bandwidth-bound</text>
  </g>
  <text x="20" y="172" fill="#b91c1c">A big prefill stalls everyone's decode (stutter), and the GPU is</text>
  <text x="20" y="190" fill="#b91c1c">tuned for neither job. TTFT and per-token latency fight each other.</text>

  <!-- After -->
  <text x="20" y="232" font-size="14" font-weight="bold" fill="#1f2937">Disaggregated: two pools, each sized and tuned for its job</text>
  <g stroke="#1f2937">
    <rect x="20" y="250" width="110" height="52" rx="8" fill="#bfdbfe"/>
    <rect x="170" y="244" width="180" height="64" rx="8" fill="#fde68a"/>
    <rect x="410" y="244" width="180" height="64" rx="8" fill="#bbf7d0"/>
    <rect x="630" y="250" width="110" height="52" rx="8" fill="#bfdbfe"/>
  </g>
  <g fill="#111827" text-anchor="middle">
    <text x="75" y="272">Router</text><text x="75" y="290" font-size="12">(llm-d EPP)</text>
    <text x="260" y="268" font-weight="bold">Prefill pool</text><text x="260" y="286" font-size="12">small TP, big token batches</text>
    <text x="500" y="268" font-weight="bold">Decode pool</text><text x="500" y="286" font-size="12">larger TP, huge batches of streams</text>
    <text x="685" y="272">Client</text><text x="685" y="290" font-size="12">streams tokens</text>
  </g>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <path d="M130 276 H170" marker-end="url(#b)"/>
    <path d="M350 276 H410" stroke="#b91c1c" marker-end="url(#r)"/>
    <path d="M590 276 H630" marker-end="url(#b)"/>
  </g>
  <text x="380" y="330" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="bold">KV cache blocks move over the network</text>
  <text x="380" y="346" text-anchor="middle" fill="#b91c1c" font-size="12">(NIXL / RDMA): this transfer is the price of the split</text>

  <rect x="20" y="366" width="720" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="34" y="386" fill="#111827">Pays off with long prompts, strict TTFT and inter-token SLOs, and enough traffic to keep both pools busy. For a small model</text>
  <text x="34" y="404" fill="#111827">on one GPU it is pure overhead. llm-d 1.0 (Oct 2026) ships a DisaggregatedSet controller to run and upgrade both pools together.</text>

  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1f2937"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b91c1c"/></marker>
  </defs>
</svg>
