# Eval set for the ShopFlow data bot. `{tz}` is replaced with the business time zone.
# Answerable items have gold_sql (hand-written, executed against the seed).
# The others have expected_behavior: clarify_or_assume | refuse | refuse_unanswerable.

- id: s1
  category: simple
  question: How many transactions are there today?
  gold_sql: |
    SELECT count(*) FROM orders
    WHERE placed_at >= date_trunc('day', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}'
- id: s2
  category: simple
  question: How many orders were placed yesterday?
  gold_sql: |
    SELECT count(*) FROM orders
    WHERE placed_at >= date_trunc('day', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}' - interval '1 day'
      AND placed_at <  date_trunc('day', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}'
- id: s3
  category: simple
  question: How many customers do we have in total?
  gold_sql: SELECT count(*) FROM customers
- id: s4
  category: simple
  question: How many products are currently active?
  gold_sql: SELECT count(*) FROM products WHERE active
- id: s5
  category: simple
  question: What is our total revenue of all time?
  gold_sql: |
    SELECT sum(total_cents) / 100.0 FROM orders WHERE status IN ('paid', 'shipped', 'delivered')
- id: s6
  category: simple
  question: How many refunds have been issued in total, and what was the total refunded amount?
  gold_sql: SELECT count(*), sum(amount_cents) / 100.0 FROM refunds
- id: s7
  category: simple
  question: How many support tickets are labelled urgent?
  gold_sql: SELECT count(*) FROM support_tickets WHERE label_priority = 'urgent'
- id: s8
  category: simple
  question: What is the average order value across all time?
  gold_sql: |
    SELECT avg(total_cents) / 100.0 FROM orders WHERE status IN ('paid', 'shipped', 'delivered')

- id: j1
  category: join
  question: Show revenue by product category for all time, highest first.
  gold_sql: |
    SELECT c.name, sum(oi.quantity * oi.unit_price_cents) / 100.0
    FROM order_items oi
    JOIN orders o ON o.id = oi.order_id
    JOIN products p ON p.id = oi.product_id
    JOIN categories c ON c.id = p.category_id
    WHERE o.status IN ('paid', 'shipped', 'delivered')
    GROUP BY c.name ORDER BY 2 DESC
  note: >-
    Category revenue is attributed from line items (order totals can't be split by category).
    A prediction using total_cents over orders joined to items double-counts and is wrong.
- id: j2
  category: join
  question: Who are our 5 biggest customers by revenue? Show their names and how much they spent.
  gold_sql: |
    SELECT c.full_name, sum(o.total_cents) / 100.0
    FROM orders o JOIN customers c ON c.id = o.customer_id
    WHERE o.status IN ('paid', 'shipped', 'delivered')
    GROUP BY c.id, c.full_name ORDER BY 2 DESC LIMIT 5
- id: j3
  category: join
  question: How many orders has each carrier shipped?
  gold_sql: SELECT carrier, count(DISTINCT order_id) FROM shipments GROUP BY carrier
- id: j4
  category: join
  question: How many orders came from each customer segment?
  gold_sql: |
    SELECT c.segment, count(*) FROM orders o JOIN customers c ON c.id = o.customer_id
    GROUP BY c.segment
- id: j5
  category: join
  question: What are the top 3 customer countries by number of orders?
  gold_sql: |
    SELECT c.country, count(*) FROM orders o JOIN customers c ON c.id = o.customer_id
    GROUP BY c.country ORDER BY 2 DESC LIMIT 3
- id: j6
  category: join
  question: How many units of Electronics products do we have in stock across all warehouses?
  gold_sql: |
    SELECT sum(i.on_hand) FROM inventory i
    JOIN products p ON p.id = i.product_id
    JOIN categories c ON c.id = p.category_id
    WHERE c.name = 'Electronics'

- id: t1
  category: time_window
  question: What's our revenue today so far?
  gold_sql: |
    SELECT coalesce(sum(total_cents), 0) / 100.0 FROM orders
    WHERE status IN ('paid', 'shipped', 'delivered')
      AND placed_at >= date_trunc('day', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}'
- id: t2
  category: time_window
  question: How many orders were placed last week?
  gold_sql: |
    SELECT count(*) FROM orders
    WHERE placed_at >= date_trunc('week', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}' - interval '1 week'
      AND placed_at <  date_trunc('week', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}'
- id: t3
  category: time_window
  question: What is revenue this month?
  gold_sql: |
    SELECT coalesce(sum(total_cents), 0) / 100.0 FROM orders
    WHERE status IN ('paid', 'shipped', 'delivered')
      AND placed_at >= date_trunc('month', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}'
- id: t4
  category: time_window
  question: How many payment attempts failed yesterday?
  gold_sql: |
    SELECT count(*) FROM payments
    WHERE status = 'failed'
      AND created_at >= date_trunc('day', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}' - interval '1 day'
      AND created_at <  date_trunc('day', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}'
- id: t5
  category: time_window
  question: How many orders have we had this week so far?
  gold_sql: |
    SELECT count(*) FROM orders
    WHERE placed_at >= date_trunc('week', now() AT TIME ZONE '{tz}') AT TIME ZONE '{tz}'

