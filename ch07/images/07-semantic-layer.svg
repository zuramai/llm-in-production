<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" rx="12" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#1d2433">Who writes the SQL?</text>

  <!-- Lane 1: Chapter 6 -->
  <rect x="20" y="58" width="940" height="150" rx="12" fill="#fdf0ef" stroke="#c0392b"/>
  <text x="36" y="82" font-size="14" font-weight="bold" fill="#7a1f16">Chapter 6: text-to-SQL. The model writes SQL; definitions live in prose.</text>

  <rect x="40" y="104" width="130" height="70" rx="10" fill="#e8dcf5" stroke="#7b4bb7"/>
  <text x="105" y="134" font-size="14" font-weight="bold" fill="#3d1f66" text-anchor="middle">question</text>
  <text x="105" y="154" font-size="11" fill="#3d1f66" text-anchor="middle">"refund rate?"</text>

  <rect x="220" y="104" width="190" height="70" rx="10" fill="#ffffff" stroke="#c0392b"/>
  <text x="315" y="130" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="middle">LLM</text>
  <text x="315" y="149" font-size="11" fill="#4a5163" text-anchor="middle">reads glossary prose</text>
  <text x="315" y="165" font-size="11" fill="#4a5163" text-anchor="middle">may pick a new definition per run</text>

  <rect x="460" y="104" width="170" height="70" rx="10" fill="#fff6e5" stroke="#f2a541"/>
  <text x="545" y="132" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="middle">free-form SQL</text>
  <text x="545" y="152" font-size="11" fill="#4a5163" text-anchor="middle">guard checks it is safe,</text>
  <text x="545" y="166" font-size="11" fill="#4a5163" text-anchor="middle">not that it is right</text>

  <rect x="680" y="104" width="260" height="70" rx="10" fill="#ffffff" stroke="#c0392b"/>
  <text x="810" y="130" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="middle">20 runs: 7.56% ×17, 2.94% ×3</text>
  <text x="810" y="150" font-size="11" fill="#4a5163" text-anchor="middle">two formulas the model chose itself;</text>
  <text x="810" y="165" font-size="11" fill="#4a5163" text-anchor="middle">finance's 3.01%: 0 of 20</text>

  <line x1="170" y1="139" x2="216" y2="139" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="139" x2="456" y2="139" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="139" x2="676" y2="139" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lane 2: Chapter 7 -->
  <rect x="20" y="226" width="940" height="226" rx="12" fill="#eef3fd" stroke="#2f6fde"/>
  <text x="36" y="250" font-size="14" font-weight="bold" fill="#1d3f80">Chapter 7: semantic layer. The model picks from a menu; code writes SQL.</text>

  <rect x="40" y="276" width="130" height="70" rx="10" fill="#e8dcf5" stroke="#7b4bb7"/>
  <text x="105" y="306" font-size="14" font-weight="bold" fill="#3d1f66" text-anchor="middle">question</text>
  <text x="105" y="326" font-size="11" fill="#3d1f66" text-anchor="middle">"refund rate?"</text>

  <rect x="220" y="276" width="190" height="70" rx="10" fill="#ffffff" stroke="#2f6fde"/>
  <text x="315" y="302" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="middle">LLM</text>
  <text x="315" y="321" font-size="11" fill="#4a5163" text-anchor="middle">emits MetricQuery JSON</text>
  <text x="315" y="337" font-size="11" fill="#4a5163" text-anchor="middle">names are schema enums</text>

  <rect x="460" y="276" width="170" height="70" rx="10" fill="#ffffff" stroke="#2f6fde"/>
  <text x="545" y="302" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="middle">compile_query()</text>
  <text x="545" y="321" font-size="11" fill="#4a5163" text-anchor="middle">validate, then build SQL</text>
  <text x="545" y="337" font-size="11" fill="#4a5163" text-anchor="middle">with the sqlglot builder</text>

  <rect x="680" y="276" width="260" height="70" rx="10" fill="#e3f4ea" stroke="#2e9d5b"/>
  <text x="810" y="302" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="middle">3.01%, 20 of 20 runs</text>
  <text x="810" y="321" font-size="11" fill="#4a5163" text-anchor="middle">run as the read-only role,</text>
  <text x="810" y="337" font-size="11" fill="#4a5163" text-anchor="middle">phrased with the definition</text>

  <line x1="170" y1="311" x2="216" y2="311" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="311" x2="456" y2="311" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="311" x2="676" y2="311" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- metrics.yaml -->
  <rect x="300" y="378" width="330" height="58" rx="10" fill="#fff6e5" stroke="#f2a541"/>
  <text x="465" y="402" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="middle">semantic/metrics.yaml</text>
  <text x="465" y="422" font-size="11" fill="#4a5163" text-anchor="middle">entities · dimensions · measures · metrics · time zone</text>
  <line x1="380" y1="378" x2="330" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="545" y1="378" x2="545" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="250" y="372" font-size="11" fill="#4a5163" text-anchor="middle">catalog + enums</text>
  <text x="600" y="368" font-size="11" fill="#4a5163">definitions</text>

  <!-- error loop -->
  <path d="M 545 276 C 545 258, 315 258, 315 272" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="268" font-size="10" fill="#4a5163" text-anchor="middle">QueryError → retry (max 3)</text>
</svg>
