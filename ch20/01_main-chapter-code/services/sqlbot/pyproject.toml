[project]
name = "ch20-sqlbot"
version = "1.0.0"
description = "ShopFlow text-to-SQL bot as an HTTP API (Chapter 20 deployment copy of Chapter 6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "openai>=3.46",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "sqlglot>=30.30",
]

[tool.uv]
package = false
