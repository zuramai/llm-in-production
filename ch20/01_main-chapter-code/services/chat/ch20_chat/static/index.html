<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopFlow Support</title>
<style>
  :root { --brand: #2f6fde; --bg: #f4f6fa; --bot: #ffffff; --user: #2f6fde; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         background: var(--bg); color: #1d2433; height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--brand); color: #fff; padding: 14px 24px; display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header span { opacity: .8; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px;
         max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .bot { background: var(--bot); align-self: flex-start; border: 1px solid #e1e5ee; }
  .user { background: var(--user); color: #fff; align-self: flex-end; }
  .error { background: #fde8e8; color: #9b1c1c; align-self: flex-start; }
  .meta { font-size: 12px; color: #6b7385; align-self: flex-start; margin-top: -6px; }
  form { display: flex; gap: 8px; padding: 16px 24px; max-width: 820px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 12px 14px; border: 1px solid #c9cfdb; border-radius: 10px; font: inherit; }
  button { padding: 0 20px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><h1>ShopFlow Support</h1><span>Ask about orders, shipping, returns and payments</span></header>
<div id="log"><div class="msg bot">Hi! I'm the ShopFlow assistant. How can I help?</div></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Type your question…" maxlength="4000" required>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

// One conversation per browser, remembered across reloads.
let sessionId = localStorage.getItem("shopflow-session");
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem("shopflow-session", sessionId);
}

function bubble(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// EventSource only supports GET, so we POST with fetch and parse the SSE stream ourselves.
async function* sseEvents(response) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) return;
    buffer += value.replace(/\r\n/g, "\n");
    let end;
    while ((end = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      const data = block.split("\n").filter(l => l.startsWith("data:"))
                        .map(l => l.slice(5).trimStart()).join("\n");
      if (data) yield JSON.parse(data);
    }
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  send.disabled = true;
  bubble("msg user", message);
  const bot = bubble("msg bot", "");
  const started = performance.now();
  let firstToken = null;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    for await (const ev of sseEvents(res)) {
      if (ev.delta) {
        firstToken ??= performance.now();
        bot.textContent += ev.delta;
        log.scrollTop = log.scrollHeight;
      } else if (ev.error) {
        bot.className = "msg error";
        bot.textContent = "Sorry, something went wrong: " + ev.error;
      } else if (ev.done) {
        const ttft = ((firstToken ?? performance.now()) - started) / 1000;
        const total = (performance.now() - started) / 1000;
        const u = ev.usage || {};
        bubble("meta", `first token ${ttft.toFixed(2)} s · total ${total.toFixed(2)} s · ` +
                       `${u.prompt_tokens ?? "?"} in / ${u.completion_tokens ?? "?"} out tokens`);
      }
    }
  } catch (err) {
    bot.className = "msg error";
    bot.textContent = "Sorry, something went wrong: " + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
