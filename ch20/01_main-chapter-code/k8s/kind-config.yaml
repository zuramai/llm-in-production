# kind cluster for Chapter 20: one control plane, two workers (so a PodDisruptionBudget and
# `kubectl drain` mean something). NodePorts are mapped to host ports:
#   chat   NodePort 30120 -> http://localhost:8320
#   sqlbot NodePort 30020 -> http://localhost:8420
#   kind create cluster --name ch20 --config ch20/01_main-chapter-code/k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30120
        hostPort: 8320
        listenAddress: "127.0.0.1"
      - containerPort: 30020
        hostPort: 8420
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker
