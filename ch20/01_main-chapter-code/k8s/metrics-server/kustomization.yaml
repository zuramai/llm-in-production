# metrics-server v0.9.1 (the HPA's source of CPU metrics), patched for kind: kind's kubelets
# serve self-signed certificates, so metrics-server must skip verifying them. Never in prod.
#   kubectl apply -k ch20/01_main-chapter-code/k8s/metrics-server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
patches:
  - target: {kind: Deployment, name: metrics-server, namespace: kube-system}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
