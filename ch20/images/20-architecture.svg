<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" rx="12" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#1d2433">ShopFlow on Kubernetes (kind): what runs where</text>

  <!-- CI/CD -->
  <rect x="30" y="70" width="170" height="150" rx="10" fill="#e8dcf5" stroke="#7b4bb7"/>
  <text x="115" y="96" font-size="15" font-weight="bold" fill="#3d1f66" text-anchor="middle">CI/CD</text>
  <text x="115" y="120" font-size="12" fill="#3d1f66" text-anchor="middle">lint + unit tests</text>
  <text x="115" y="140" font-size="12" fill="#3d1f66" text-anchor="middle">build images</text>
  <text x="115" y="160" font-size="12" fill="#3d1f66" text-anchor="middle">Compose stack</text>
  <text x="115" y="180" font-size="12" font-weight="bold" fill="#3d1f66" text-anchor="middle">eval gate</text>
  <text x="115" y="200" font-size="12" fill="#3d1f66" text-anchor="middle">deploy → canary</text>

  <!-- users -->
  <rect x="30" y="300" width="170" height="70" rx="10" fill="#e3f4ea" stroke="#2e8b57"/>
  <text x="115" y="330" font-size="15" font-weight="bold" fill="#1b4d32" text-anchor="middle">Clients</text>
  <text x="115" y="350" font-size="12" fill="#1b4d32" text-anchor="middle">browser · Slack · CI → NodePorts</text>

  <!-- cluster -->
  <rect x="240" y="60" width="520" height="440" rx="12" fill="#eef3fd" stroke="#2f6fde"/>
  <text x="256" y="84" font-size="14" font-weight="bold" fill="#1d3f80">kind cluster "ch20" · namespace shopflow · 1 control plane + 2 workers</text>

  <!-- config -->
  <rect x="260" y="100" width="230" height="72" rx="8" fill="#fff6e5" stroke="#f2a541"/>
  <text x="375" y="122" font-size="13" font-weight="bold" fill="#5c3b00" text-anchor="middle">ConfigMap chat-config-&lt;hash&gt;</text>
  <text x="375" y="142" font-size="10.5" fill="#5c3b00" text-anchor="middle">prompt stable v1 · canary v2 · CANARY_PERCENT</text>
  <text x="375" y="160" font-size="11" fill="#5c3b00" text-anchor="middle">model · token limits · session store</text>
  <rect x="510" y="100" width="230" height="72" rx="8" fill="#fde8e8" stroke="#c0392b"/>
  <text x="625" y="122" font-size="13" font-weight="bold" fill="#7a1c14" text-anchor="middle">Secrets (from .env)</text>
  <text x="625" y="142" font-size="11" fill="#7a1c14" text-anchor="middle">LLM_API_KEY</text>
  <text x="625" y="160" font-size="11" fill="#7a1c14" text-anchor="middle">session-store DSN · read-only DSN</text>

  <!-- chat -->
  <rect x="260" y="195" width="230" height="190" rx="10" fill="#ffffff" stroke="#2f6fde"/>
  <text x="375" y="217" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="middle">Deployment chat</text>
  <text x="375" y="235" font-size="11" fill="#4a5163" text-anchor="middle">Service NodePort 30120 → :8320</text>
  <rect x="275" y="248" width="60" height="44" rx="6" fill="#dce8fb" stroke="#2f6fde"/>
  <text x="305" y="275" font-size="11" fill="#1d2433" text-anchor="middle">pod</text>
  <rect x="345" y="248" width="60" height="44" rx="6" fill="#dce8fb" stroke="#2f6fde"/>
  <text x="375" y="275" font-size="11" fill="#1d2433" text-anchor="middle">pod</text>
  <rect x="415" y="248" width="60" height="44" rx="6" fill="#ffffff" stroke="#2f6fde" stroke-dasharray="4 3"/>
  <text x="445" y="275" font-size="11" fill="#4a5163" text-anchor="middle">+HPA</text>
  <text x="375" y="312" font-size="11" fill="#4a5163" text-anchor="middle">HPA 2–6 pods on CPU · PDB minAvailable 1</text>
  <text x="375" y="330" font-size="11" fill="#4a5163" text-anchor="middle">probes: startup · ready (/readyz) · live</text>
  <text x="375" y="348" font-size="11" fill="#4a5163" text-anchor="middle">preStop 15 s · grace 45 s</text>
  <text x="375" y="370" font-size="11" fill="#4a5163" text-anchor="middle">router: hash(session) → v1 or v2</text>

  <!-- sqlbot -->
  <rect x="510" y="195" width="230" height="190" rx="10" fill="#ffffff" stroke="#2f6fde"/>
  <text x="625" y="217" font-size="14" font-weight="bold" fill="#1d2433" text-anchor="middle">Deployment sqlbot</text>
  <text x="625" y="235" font-size="11" fill="#4a5163" text-anchor="middle">Service NodePort 30020 → :8420</text>
  <rect x="560" y="248" width="60" height="44" rx="6" fill="#dce8fb" stroke="#2f6fde"/>
  <text x="590" y="275" font-size="11" fill="#1d2433" text-anchor="middle">pod</text>
  <rect x="630" y="248" width="60" height="44" rx="6" fill="#dce8fb" stroke="#2f6fde"/>
  <text x="660" y="275" font-size="11" fill="#1d2433" text-anchor="middle">pod</text>
  <text x="625" y="312" font-size="11" fill="#4a5163" text-anchor="middle">2 replicas · PDB maxUnavailable 1</text>
  <text x="625" y="330" font-size="11" fill="#4a5163" text-anchor="middle">POST /ask → plan · guard · run · phrase</text>
  <text x="625" y="348" font-size="11" fill="#4a5163" text-anchor="middle">read-only role only</text>

  <!-- external db service -->
  <rect x="260" y="405" width="480" height="76" rx="8" fill="#f3f4f7" stroke="#888888"/>
  <text x="500" y="430" font-size="13" font-weight="bold" fill="#1d2433" text-anchor="middle">Service shopflow-db (no selector) + EndpointSlice</text>
  <text x="500" y="450" font-size="11" fill="#4a5163" text-anchor="middle">a stable in-cluster name for a database that lives outside the cluster</text>
  <text x="500" y="468" font-size="11" fill="#4a5163" text-anchor="middle">fakellm Deployment (test double) lives here too during load tests</text>

  <!-- external -->
  <rect x="800" y="120" width="170" height="90" rx="10" fill="#e3f4ea" stroke="#2e8b57"/>
  <text x="885" y="150" font-size="15" font-weight="bold" fill="#1b4d32" text-anchor="middle">OpenRouter</text>
  <text x="885" y="172" font-size="12" fill="#1b4d32" text-anchor="middle">openai/gpt-6-luna</text>
  <text x="885" y="192" font-size="12" fill="#1b4d32" text-anchor="middle">HTTPS egress</text>
  <rect x="800" y="400" width="170" height="90" rx="10" fill="#e3f4ea" stroke="#2e8b57"/>
  <text x="885" y="430" font-size="15" font-weight="bold" fill="#1b4d32" text-anchor="middle">Postgres 18</text>
  <text x="885" y="452" font-size="12" fill="#1b4d32" text-anchor="middle">shopflow-db container</text>
  <text x="885" y="472" font-size="12" fill="#1b4d32" text-anchor="middle">ch20.chat_sessions</text>

  <!-- arrows -->
  <line x1="200" y1="145" x2="255" y2="145" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="335" x2="255" y2="300" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="250" x2="800" y2="185" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="200" x2="800" y2="178" stroke="#888888" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <line x1="740" y1="443" x2="800" y2="443" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="375" y1="385" x2="375" y2="403" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="625" y1="385" x2="625" y2="403" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
