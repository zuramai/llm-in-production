<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">One base model, many adapters: vLLM --enable-lora on :8218</text>

  <!-- clients -->
  <g font-size="12" fill="#1b2a3a">
    <rect x="24" y="70" width="190" height="44" rx="8" fill="#cfe3f7" stroke="#5b8fc7"/>
    <text x="119" y="88" text-anchor="middle">triage service</text>
    <text x="119" y="105" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">model="q17-lora"</text>
    <rect x="24" y="136" width="190" height="44" rx="8" fill="#cfe3f7" stroke="#5b8fc7"/>
    <text x="119" y="154" text-anchor="middle">A/B test, 5% of traffic</text>
    <text x="119" y="171" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">model="q17-qlora"</text>
    <rect x="24" y="202" width="190" height="44" rx="8" fill="#cfe3f7" stroke="#5b8fc7"/>
    <text x="119" y="220" text-anchor="middle">anything else</text>
    <text x="119" y="237" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">model="Qwen/Qwen3-1.7B"</text>
  </g>

  <!-- server -->
  <rect x="270" y="56" width="466" height="246" rx="10" fill="#eef1f5" stroke="#888"/>
  <text x="503" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">vLLM server (one process, one GPU)</text>

  <rect x="292" y="96" width="250" height="186" rx="8" fill="#d9d9d9" stroke="#888"/>
  <text x="417" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Qwen3-1.7B base</text>
  <text x="417" y="148" text-anchor="middle" font-size="12" fill="#222">bf16 weights, loaded once</text>
  <text x="417" y="168" text-anchor="middle" font-size="12" fill="#222">shared KV cache</text>
  <text x="417" y="188" text-anchor="middle" font-size="12" fill="#222">continuous batching mixes</text>
  <text x="417" y="206" text-anchor="middle" font-size="12" fill="#222">requests for different adapters</text>
  <text x="417" y="226" text-anchor="middle" font-size="12" fill="#222">in the same batch</text>

  <g font-size="12" fill="#3a2a10">
    <rect x="566" y="96" width="150" height="40" rx="8" fill="#f7d9a8" stroke="#c98b2b"/>
    <text x="641" y="121" text-anchor="middle">q17-lora</text>
    <rect x="566" y="146" width="150" height="40" rx="8" fill="#f7d9a8" stroke="#c98b2b"/>
    <text x="641" y="171" text-anchor="middle">q17-qlora</text>
    <rect x="566" y="196" width="150" height="40" rx="8" fill="#f7d9a8" stroke="#c98b2b"/>
    <text x="641" y="221" text-anchor="middle">q17-lora-v2</text>
    <text x="641" y="262" text-anchor="middle" fill="#3a2a10">adapters: tens of MB each,</text>
    <text x="641" y="278" text-anchor="middle" fill="#3a2a10">--max-loras per batch</text>
  </g>

  <g stroke="#888" stroke-width="2" fill="none">
    <path d="M214 92 L292 140"/>
    <path d="M214 158 L292 175"/>
    <path d="M214 224 L292 210"/>
    <path d="M542 116 L566 116"/>
    <path d="M542 166 L566 166"/>
    <path d="M542 216 L566 216"/>
  </g>
  <g fill="#888">
    <polygon points="292,140 283,140 288,132"/>
    <polygon points="292,175 283,170 284,180"/>
    <polygon points="292,210 283,207 285,217"/>
  </g>
</svg>
