# 40 questions about the ShopFlow document corpus (datasets/shopflow/docs, 36 Markdown files).
#
# category: keyword      exact identifiers / commands / metric names (favours word matching)
#           paraphrase   the question shares almost no words with the answer (favours meaning)
#           multi        the answer needs facts from two different documents
#           direct       plain fact lookup, wording close to the document
#           unanswerable the corpus does not contain the answer (the system must say so)
#
# evidence: a list of "slots". A slot is satisfied by retrieving ANY chunk from one of its paths
#           (the corpus restates policies in several documents, so several paths are valid).
#           `verify` is a regex over the whitespace-normalised document text. `paths: auto` means
#           "every document that matches `verify`" (used where the fact is restated everywhere);
#           an explicit list is checked against `verify` by a test, and
#           `python -m ch04_rag.evalset audit` prints documents that match but aren't listed.
# reference: the short human-written correct answer the judge compares against.

- id: q01
  category: keyword
  question: "Which command rolls the checkout service back to an earlier version?"
  reference: "`deployctl rollback checkout --to <version>`"
  evidence:
    - verify: 'deployctl rollback checkout'
      paths: [runbooks/checkout-bad-deploy.md, runbooks/checkout-db-pool-exhaustion.md, handbook/on-call.md, handbook/incident-severity.md]

- id: q02
  category: keyword
  question: "Which feature flag do we flip to fail over between payment providers?"
  reference: "`payments.primary_provider`"
  evidence:
    - verify: 'payments\.primary_provider'
      paths: [runbooks/payment-provider-timeout.md, handbook/on-call.md, handbook/incident-severity.md]

