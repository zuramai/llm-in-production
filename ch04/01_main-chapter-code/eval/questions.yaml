  evidence:
    - verify: '(?i)vip[^.]{0,80}free (standard )?shipping|free (standard )?shipping[^.]{0,60}vip'
      paths: auto
    - verify: '(?i)discount code'
      paths: [policies/gift-cards-and-promotions.md]

