- id: q31
  category: multi
  question: "A bad deploy broke checkout during the Black Friday change freeze. Can we ship a fix, and what is the first mitigation step?"
  reference: "Only fixes for SEV1/SEV2 issues may ship during the freeze, with sign-off from the engineering on-call lead and a rollback plan; the first step is to roll back with `deployctl rollback checkout --to <version>`."
  evidence:
    - verify: 'Only fixes for SEV1/SEV2'
      paths: [handbook/holiday-peak-playbook.md]
    - verify: 'deployctl rollback'
      paths: auto

- id: q32
  category: multi
  question: "Checkout p95 latency has been 3 seconds for 15 minutes and db_pool_connections_in_use equals db_pool_size. What severity is this and what is the first mitigation to consider?"
  reference: "SEV2 (p95 above 2s sustained for 10 minutes; SEV1 if checkout is effectively down). Mitigation depends on the cause: kill long-running queries, temporarily raise the pool size for a traffic spike, or roll back if a deploy leaks connections."
  evidence:
    - verify: '(?i)p95[^.|]{0,60}(>|above) ?2s'
      paths: auto
    - verify: 'db_pool_connections_in_use'
      paths: auto

