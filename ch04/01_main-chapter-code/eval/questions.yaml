      paths: [runbooks/checkout-db-pool-exhaustion.md]

- id: q07
  category: keyword
  question: "Which PromQL expression gives the checkout 5xx error ratio?"
  reference: 'sum(rate(http_requests_total{job="checkout",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="checkout"}[5m]))'
  evidence:
    - verify: 'sum\(rate\(http_requests_total\{job="checkout",status=~"5\.\."\}\[5m\]\)\)'
      paths: [runbooks/checkout-bad-deploy.md]

- id: q08
