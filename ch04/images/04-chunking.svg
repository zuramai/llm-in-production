<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="400" rx="14" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Same document, two ways to cut it</text>

  <text x="30" y="68" font-size="14" font-weight="bold" fill="#374151">Fixed window: 512 tokens, 64 overlap (the cut ignores structure)</text>
  <rect x="30" y="80" width="900" height="44" rx="6" fill="#f3f4f6" stroke="#888"/>
  <text x="40" y="107" font-size="12" fill="#1f2937"># Refund Policy · ## Timing · ## Method · ## What is eligible · ## Return shipping · …</text>
  <rect x="30" y="140" width="400" height="40" rx="6" fill="#bfdbfe" stroke="#888"/>
  <text x="230" y="165" text-anchor="middle" font-size="12" fill="#1f2937">chunk 0 (512 tokens): ends mid-section</text>
  <rect x="370" y="190" width="400" height="40" rx="6" fill="#bbf7d0" stroke="#888"/>
  <text x="570" y="215" text-anchor="middle" font-size="12" fill="#1f2937">chunk 1: starts 64 tokens before chunk 0 ended</text>
  <rect x="370" y="140" width="60" height="40" rx="0" fill="#fde68a" stroke="#888" opacity="0.9"/>
  <text x="400" y="164" text-anchor="middle" font-size="11" fill="#1f2937">overlap</text>
  <text x="30" y="250" font-size="12" fill="#374151">+ few, big chunks (79 for 36 docs)   − a chunk can mix two topics and has no title of its own</text>

  <text x="30" y="292" font-size="14" font-weight="bold" fill="#374151">Heading-aware: one chunk per section, heading path travels with it</text>
  <rect x="30" y="304" width="190" height="44" rx="6" fill="#ddd6fe" stroke="#888"/>
  <text x="125" y="323" text-anchor="middle" font-size="11" fill="#1f2937">Refund Policy &gt; Refund Timing</text>
  <text x="125" y="340" text-anchor="middle" font-size="11" fill="#1f2937">body of that section</text>
  <rect x="235" y="304" width="190" height="44" rx="6" fill="#ddd6fe" stroke="#888"/>
  <text x="330" y="323" text-anchor="middle" font-size="11" fill="#1f2937">Refund Policy &gt; Refund Method</text>
  <text x="330" y="340" text-anchor="middle" font-size="11" fill="#1f2937">body of that section</text>
  <rect x="440" y="304" width="190" height="44" rx="6" fill="#ddd6fe" stroke="#888"/>
  <text x="535" y="323" text-anchor="middle" font-size="11" fill="#1f2937">… &gt; Return Shipping</text>
  <text x="535" y="340" text-anchor="middle" font-size="11" fill="#1f2937">body of that section</text>
  <text x="650" y="330" font-size="12" fill="#374151">…</text>
  <text x="30" y="378" font-size="12" fill="#374151">+ self-describing chunks, exact cut points   − many small chunks (316), tiny sections ("Contact support") look alike in every doc</text>
</svg>
