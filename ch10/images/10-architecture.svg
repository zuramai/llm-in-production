<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">The ShopFlow refund agent: the model proposes, a human disposes</text>

  <!-- support agent -->
  <rect x="20" y="80" width="150" height="70" rx="10" fill="#9ecae1" stroke="#555"/>
  <text x="95" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Support agent</text>
  <text x="95" y="130" text-anchor="middle" font-size="12" fill="#111">asks in plain English</text>

  <!-- graph box -->
  <rect x="205" y="62" width="480" height="250" rx="12" fill="#f2f2f2" stroke="#888" stroke-dasharray="6 4"/>
  <text x="445" y="298" text-anchor="middle" font-size="12" fill="#333">LangGraph state machine (ch10_graph.py)</text>

  <rect x="225" y="96" width="150" height="56" rx="8" fill="#c7e9c0" stroke="#555"/>
  <text x="300" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">agent</text>
  <text x="300" y="139" text-anchor="middle" font-size="11" fill="#111">LLM call, compacted view</text>

  <rect x="405" y="96" width="150" height="56" rx="8" fill="#c7e9c0" stroke="#555"/>
  <text x="480" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">tools</text>
  <text x="480" y="139" text-anchor="middle" font-size="11" fill="#111">reads + validate refund</text>

  <rect x="405" y="200" width="130" height="56" rx="8" fill="#fdd0a2" stroke="#555"/>
  <text x="470" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">approval</text>
  <text x="470" y="243" text-anchor="middle" font-size="11" fill="#111">interrupt(): pause</text>

  <rect x="555" y="200" width="115" height="56" rx="8" fill="#fcbba1" stroke="#555"/>
  <text x="612" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">execute</text>
  <text x="612" y="243" text-anchor="middle" font-size="11" fill="#111">idempotent write</text>

  <line x1="375" y1="116" x2="403" y2="116" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="405" y1="136" x2="377" y2="136" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="152" x2="470" y2="198" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="535" y1="228" x2="553" y2="228" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M405,228 C330,228 305,200 300,154" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <text x="232" y="185" font-size="11" fill="#333">rejected or</text>
  <text x="232" y="199" font-size="11" fill="#333">role too junior</text>
  <path d="M612,200 C612,80 560,82 377,100" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <text x="590" y="175" font-size="11" fill="#333">result</text>

  <line x1="170" y1="115" x2="223" y2="120" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LLM -->
  <rect x="710" y="80" width="170" height="70" rx="10" fill="#dadaeb" stroke="#555"/>
  <text x="795" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">LLM</text>
  <text x="795" y="128" text-anchor="middle" font-size="12" fill="#111">Chat Completions:</text>
  <text x="795" y="143" text-anchor="middle" font-size="11" fill="#111">OpenRouter or Ollama</text>
  <path d="M300,96 C310,52 700,50 745,78" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- approver -->
  <rect x="20" y="245" width="150" height="80" rx="10" fill="#fdae6b" stroke="#555"/>
  <text x="95" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Approver</text>
  <text x="95" y="290" text-anchor="middle" font-size="12" fill="#111">agent ≤ $100</text>
  <text x="95" y="305" text-anchor="middle" font-size="12" fill="#111">lead ≤ $500 · Finance</text>
  <path d="M405,248 C320,285 260,290 172,288" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 3"/>
  <text x="20" y="345" font-size="11" fill="#333">minutes or days later:</text>
  <text x="20" y="360" font-size="11" fill="#333">Command(resume={approved, role})</text>

  <!-- data -->
  <rect x="230" y="372" width="190" height="72" rx="10" fill="#e5f5e0" stroke="#555"/>
  <text x="325" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">ShopFlow DB (public)</text>
  <text x="325" y="417" text-anchor="middle" font-size="12" fill="#111">orders, refunds, tickets</text>
  <text x="325" y="433" text-anchor="middle" font-size="11" fill="#111">read-only role for tools</text>

  <rect x="455" y="372" width="210" height="72" rx="10" fill="#fee6ce" stroke="#555"/>
  <text x="560" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">schema ch10</text>
  <text x="560" y="417" text-anchor="middle" font-size="12" fill="#111">refund_ledger (money moved)</text>
  <text x="560" y="433" text-anchor="middle" font-size="12" fill="#111">checkpoints (every step)</text>

  <path d="M430,152 C380,250 340,300 325,370" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="612" y1="256" x2="590" y2="370" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="675" y1="312" x2="650" y2="370" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="690" y="340" font-size="11" fill="#333">state saved after</text>
  <text x="690" y="354" font-size="11" fill="#333">every node</text>

  <rect x="710" y="190" width="170" height="110" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="795" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Invariants</text>
  <text x="720" y="233" font-size="11" fill="#222">• no write before interrupt()</text>
  <text x="720" y="251" font-size="11" fill="#222">• role checked in code</text>
  <text x="720" y="269" font-size="11" fill="#222">• one refund per order+reason</text>
  <text x="720" y="287" font-size="11" fill="#222">• full tool output in state</text>
</svg>
