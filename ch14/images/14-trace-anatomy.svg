<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="430" rx="16" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Anatomy of one trace: "How many transactions are there today?"</text>

  <!-- time axis -->
  <line x1="250" y1="62" x2="860" y2="62" stroke="#888" stroke-width="1.5"/>
  <text x="250" y="56" font-size="12" fill="#555">0 s</text>
  <text x="860" y="56" font-size="12" fill="#555" text-anchor="end">end of request</text>

  <!-- labels column -->
  <text x="30" y="100" font-weight="bold" fill="#222">trace  sqlbot</text>
  <text x="30" y="118" font-size="12" fill="#555">user_id, session_id, tags, release</text>

  <text x="48" y="158" fill="#222">agent  sqlbot.answer</text>
  <text x="66" y="198" fill="#222">generation  plan</text>
  <text x="66" y="238" fill="#222">guardrail  sql_guard</text>
  <text x="66" y="278" fill="#222">tool  postgres.query</text>
  <text x="66" y="318" fill="#222">generation  phrase</text>
  <text x="30" y="370" font-weight="bold" fill="#222">scores</text>

  <!-- bars -->
  <rect x="250" y="84" width="610" height="26" rx="5" fill="#e6e0f3" stroke="#7d6bb0"/>
  <rect x="252" y="142" width="606" height="26" rx="5" fill="#cfe3f7" stroke="#5b8fc7"/>
  <rect x="256" y="182" width="400" height="26" rx="5" fill="#fde2b8" stroke="#d99a3a"/>
  <text x="266" y="200" font-size="12" fill="#5a3a00">model · prompt sqlbot-planner v1 · tokens · $ cost · gen_ai.*</text>
  <rect x="658" y="222" width="10" height="26" rx="3" fill="#d4edda" stroke="#4f9a5f"/>
  <text x="676" y="240" font-size="12" fill="#1e4620">pass / rule=… (WARNING)</text>
  <rect x="670" y="262" width="22" height="26" rx="3" fill="#d4edda" stroke="#4f9a5f"/>
  <text x="700" y="280" font-size="12" fill="#1e4620">row_count only, no rows</text>
  <rect x="694" y="302" width="162" height="26" rx="5" fill="#fde2b8" stroke="#d99a3a"/>
  <text x="702" y="320" font-size="12" fill="#5a3a00">prompt sqlbot-answer v1</text>

  <!-- scores -->
  <rect x="250" y="352" width="190" height="30" rx="15" fill="#d4edda" stroke="#4f9a5f"/>
  <text x="345" y="372" text-anchor="middle" font-size="13" fill="#1e4620">user_feedback = 1 (CLI)</text>
  <rect x="455" y="352" width="190" height="30" rx="15" fill="#f8d7da" stroke="#c0565f"/>
  <text x="550" y="372" text-anchor="middle" font-size="13" fill="#6b1e25">correct = 0 (experiment)</text>
  <rect x="660" y="352" width="200" height="30" rx="15" fill="#e6e0f3" stroke="#7d6bb0"/>
  <text x="760" y="372" text-anchor="middle" font-size="13" fill="#33275c">linked to dataset item s1</text>

  <text x="450" y="412" text-anchor="middle" font-size="12" fill="#555">Bars are schematic; measured latencies per observation are in the chapter's latency chart.</text>
</svg>
