<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="520" rx="16" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">What an inference server does between your HTTP call and the GPU</text>

  <!-- client -->
  <rect x="40" y="60" width="780" height="50" rx="10" fill="#cfe3f7" stroke="#888"/>
  <text x="60" y="91" font-size="15" fill="#123">Your app: openai.OpenAI(base_url=...).chat.completions.create(stream=True)</text>

  <!-- API layer -->
  <rect x="40" y="128" width="780" height="60" rx="10" fill="#d8ecd2" stroke="#888"/>
  <text x="60" y="152" font-size="15" font-weight="bold" fill="#1c3a14">1. OpenAI-compatible HTTP API</text>
  <text x="60" y="174" font-size="13" fill="#1c3a14">/v1/chat/completions · chat template (Jinja) · tokenizer · SSE streaming · /health · /metrics · API key</text>

  <!-- scheduler -->
  <rect x="40" y="206" width="780" height="78" rx="10" fill="#fbe3c4" stroke="#888"/>
  <text x="60" y="230" font-size="15" font-weight="bold" fill="#4a2c05">2. Scheduler: the part that decides throughput under load</text>
  <text x="60" y="252" font-size="13" fill="#4a2c05">waiting queue → running batch. Continuous batching adds and removes requests every step,</text>
  <text x="60" y="270" font-size="13" fill="#4a2c05">mixes prefill (read the prompt) with decode (one token per request per step), preempts on OOM.</text>

  <!-- KV cache -->
  <rect x="40" y="302" width="780" height="78" rx="10" fill="#e6dcf3" stroke="#888"/>
  <text x="60" y="326" font-size="15" font-weight="bold" fill="#2e1a4a">3. KV-cache manager: the memory every in-flight token occupies</text>
  <text x="60" y="348" font-size="13" fill="#2e1a4a">vLLM: PagedAttention blocks · SGLang: RadixAttention tree · llama.cpp: one context split into slots</text>
  <g fill="#b9a3dc" stroke="#888">
    <rect x="560" y="356" width="18" height="16"/><rect x="580" y="356" width="18" height="16"/><rect x="600" y="356" width="18" height="16"/>
    <rect x="620" y="356" width="18" height="16" fill="#f0eaf8"/><rect x="640" y="356" width="18" height="16"/><rect x="660" y="356" width="18" height="16" fill="#f0eaf8"/>
    <rect x="680" y="356" width="18" height="16"/><rect x="700" y="356" width="18" height="16" fill="#f0eaf8"/><rect x="720" y="356" width="18" height="16" fill="#f0eaf8"/>
  </g>
  <text x="745" y="369" font-size="11" fill="#2e1a4a">blocks</text>

  <!-- executor -->
  <rect x="40" y="398" width="780" height="50" rx="10" fill="#f6d0d0" stroke="#888"/>
  <text x="60" y="420" font-size="15" font-weight="bold" fill="#4a1010">4. Model executor</text>
  <text x="60" y="440" font-size="13" fill="#4a1010">weights (BF16, GGUF Q4_K_M, ...) · attention kernels (FlashAttention, FlashInfer) · CUDA graphs</text>

  <!-- GPU -->
  <rect x="40" y="462" width="780" height="40" rx="10" fill="#e3e3e3" stroke="#888"/>
  <text x="60" y="488" font-size="15" fill="#222">GPU: NVIDIA RTX 3090 · 24 GB GDDR6X · 936 GB/s: memory, not compute, limits single-stream decode</text>
</svg>
