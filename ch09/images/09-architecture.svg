<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="14" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Chapter 9: one set of tools, two ways to reach them</text>

  <!-- user -->
  <rect x="24" y="190" width="130" height="64" rx="10" fill="#cfe3ff" stroke="#4a7fd1"/>
  <text x="89" y="218" text-anchor="middle" font-size="14" fill="#111">Support agent</text>
  <text x="89" y="237" text-anchor="middle" font-size="12" fill="#111">(a human)</text>

  <!-- agent loop -->
  <rect x="200" y="150" width="190" height="144" rx="10" fill="#ffe3a8" stroke="#c9961c"/>
  <text x="295" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Agent loop</text>
  <text x="295" y="198" text-anchor="middle" font-size="12" fill="#111">OpenAI SDK, ~100 lines</text>
  <text x="295" y="220" text-anchor="middle" font-size="12" fill="#111">max 8 steps</text>
  <text x="295" y="238" text-anchor="middle" font-size="12" fill="#111">token budget per run</text>
  <text x="295" y="256" text-anchor="middle" font-size="12" fill="#111">tool errors = messages</text>
  <text x="295" y="274" text-anchor="middle" font-size="12" fill="#111">parallel tool calls</text>

  <!-- LLM -->
  <rect x="200" y="40" width="190" height="62" rx="10" fill="#e6d1ff" stroke="#8a5cc9"/>
  <text x="295" y="66" text-anchor="middle" font-size="14" fill="#111">LLM (chat completions)</text>
  <text x="295" y="86" text-anchor="middle" font-size="12" fill="#111">proposes tool calls</text>
  <line x1="295" y1="150" x2="295" y2="104" stroke="#888" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <line x1="154" y1="222" x2="198" y2="222" stroke="#888" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- path A: in-process -->
  <rect x="440" y="104" width="190" height="64" rx="10" fill="#c9f0d4" stroke="#3f9a5b"/>
  <text x="535" y="130" text-anchor="middle" font-size="14" fill="#111">Path A: LocalToolbox</text>
  <text x="535" y="150" text-anchor="middle" font-size="12" fill="#111">plain function calls</text>
  <line x1="390" y1="200" x2="438" y2="150" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- path B: MCP -->
  <rect x="440" y="250" width="190" height="64" rx="10" fill="#c9f0d4" stroke="#3f9a5b"/>
  <text x="535" y="276" text-anchor="middle" font-size="14" fill="#111">Path B: MCP client</text>
  <text x="535" y="296" text-anchor="middle" font-size="12" fill="#111">tool schema -&gt; OpenAI schema</text>
  <line x1="390" y1="248" x2="438" y2="278" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <rect x="440" y="354" width="190" height="64" rx="10" fill="#d8f5e0" stroke="#3f9a5b"/>
  <text x="535" y="380" text-anchor="middle" font-size="14" fill="#111">MCP server (MCPServer)</text>
  <text x="535" y="400" text-anchor="middle" font-size="12" fill="#111">stdio  |  HTTP :8009/mcp</text>
  <line x1="535" y1="314" x2="535" y2="352" stroke="#888" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- tools -->
  <rect x="690" y="150" width="240" height="190" rx="10" fill="#fff2c6" stroke="#c9a61c"/>
  <text x="810" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">ch09_tools.py (the tools)</text>
  <text x="810" y="202" text-anchor="middle" font-size="12" fill="#111">get_order        (read-only role)</text>
  <text x="810" y="222" text-anchor="middle" font-size="12" fill="#111">check_inventory  (read-only role)</text>
  <text x="810" y="242" text-anchor="middle" font-size="12" fill="#111">search_orders    (admin, 1 query)</text>
  <text x="810" y="262" text-anchor="middle" font-size="12" fill="#111">create_refund    (proposes only)</text>
  <text x="810" y="296" text-anchor="middle" font-size="12" fill="#111">limits + idempotency live here,</text>
  <text x="810" y="314" text-anchor="middle" font-size="12" fill="#111">as ordinary code</text>
  <line x1="630" y1="136" x2="688" y2="190" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="630" y1="400" x2="810" y2="342" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- db -->
  <rect x="690" y="400" width="240" height="84" rx="10" fill="#cfe3ff" stroke="#4a7fd1"/>
  <text x="810" y="426" text-anchor="middle" font-size="14" fill="#111">ShopFlow Postgres :5433</text>
  <text x="810" y="448" text-anchor="middle" font-size="12" fill="#111">orders, products, inventory ...</text>
  <text x="810" y="468" text-anchor="middle" font-size="12" fill="#111">ch09_pending_refunds (unique key)</text>
  <line x1="810" y1="340" x2="810" y2="398" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- approval -->
  <rect x="24" y="400" width="360" height="84" rx="10" fill="#ffd6d6" stroke="#cc5555"/>
  <text x="204" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">approve.py --role agent | team_lead | finance</text>
  <text x="204" y="450" text-anchor="middle" font-size="12" fill="#111">the only code that can turn "pending" into "approved"</text>
  <text x="204" y="468" text-anchor="middle" font-size="12" fill="#111">the model has no path to it</text>
  <line x1="386" y1="442" x2="688" y2="442" stroke="#888" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
</svg>
