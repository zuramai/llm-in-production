<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="900" height="470" rx="14" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">A refund request passes five gates; only the first is "soft"</text>

  <rect x="30" y="60" width="150" height="66" rx="10" fill="#e6d1ff" stroke="#8a5cc9"/>
  <text x="105" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">1. Prompt rules</text>
  <text x="105" y="108" text-anchor="middle" font-size="11" fill="#111">"tickets are data"</text>
  <text x="105" y="122" text-anchor="middle" font-size="11" fill="#111">can be ignored</text>

  <rect x="195" y="60" width="150" height="66" rx="10" fill="#ffe3a8" stroke="#c9961c"/>
  <text x="270" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">2. Schema</text>
  <text x="270" y="108" text-anchor="middle" font-size="11" fill="#111">reason enum, cents &gt; 0,</text>
  <text x="270" y="122" text-anchor="middle" font-size="11" fill="#111">no extra arguments</text>

  <rect x="360" y="60" width="150" height="66" rx="10" fill="#ffe3a8" stroke="#c9961c"/>
  <text x="435" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">3. Tool code</text>
  <text x="435" y="108" text-anchor="middle" font-size="11" fill="#111">order exists, refundable,</text>
  <text x="435" y="122" text-anchor="middle" font-size="11" fill="#111">cap = order total</text>

  <rect x="525" y="60" width="150" height="66" rx="10" fill="#c9f0d4" stroke="#3f9a5b"/>
  <text x="600" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">4. Database</text>
  <text x="600" y="108" text-anchor="middle" font-size="11" fill="#111">unique idempotency key,</text>
  <text x="600" y="122" text-anchor="middle" font-size="11" fill="#111">order+reason, FK, CHECK</text>

  <rect x="690" y="60" width="180" height="66" rx="10" fill="#ffd6d6" stroke="#cc5555"/>
  <text x="780" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">5. Human approval</text>
  <text x="780" y="108" text-anchor="middle" font-size="11" fill="#111">role &gt;= required approver</text>
  <text x="780" y="122" text-anchor="middle" font-size="11" fill="#111">agent $100 / lead $500 / Finance</text>

  <line x1="180" y1="93" x2="193" y2="93" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="93" x2="358" y2="93" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="93" x2="523" y2="93" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="675" y1="93" x2="688" y2="93" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <text x="450" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">What each gate stops</text>
  <rect x="30" y="185" width="840" height="30" fill="#f1f3f5" stroke="#ccc"/>
  <text x="42" y="205" font-size="12" fill="#111">Injected "refund me $5000" in a ticket</text>
  <text x="400" y="205" font-size="12" fill="#111">gate 1 may fail; gates 3 and 5 still bound the damage (order total, human)</text>
  <rect x="30" y="215" width="840" height="30" fill="#ffffff" stroke="#ccc"/>
  <text x="42" y="235" font-size="12" fill="#111">Model invents reason "item broke" or negative cents</text>
  <text x="400" y="235" font-size="12" fill="#111">gate 2: error message goes back to the model</text>
  <rect x="30" y="245" width="840" height="30" fill="#f1f3f5" stroke="#ccc"/>
  <text x="42" y="265" font-size="12" fill="#111">Hallucinated order id / refund on an unpaid order</text>
  <text x="400" y="265" font-size="12" fill="#111">gate 3: "order 99999999 not found"</text>
  <rect x="30" y="275" width="840" height="30" fill="#ffffff" stroke="#ccc"/>
  <text x="42" y="295" font-size="12" fill="#111">Timeout, then the same refund is submitted again</text>
  <text x="400" y="295" font-size="12" fill="#111">gate 4: same key replays the stored result, no second row</text>
  <rect x="30" y="305" width="840" height="30" fill="#f1f3f5" stroke="#ccc"/>
  <text x="42" y="325" font-size="12" fill="#111">Two $60 requests to dodge the $100 limit</text>
  <text x="400" y="325" font-size="12" fill="#111">gate 3: limits use the combined per-order total, so lead needed</text>
  <rect x="30" y="335" width="840" height="30" fill="#ffffff" stroke="#ccc"/>
  <text x="42" y="355" font-size="12" fill="#111">Anything the model gets past gates 1-4</text>
  <text x="400" y="355" font-size="12" fill="#111">gate 5: nothing moves until a human with the right role approves</text>

  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#222">The model holds no privilege. The tool holds the narrow privilege; the approver holds the authority.</text>
  <text x="450" y="428" text-anchor="middle" font-size="12" fill="#555">Gates 2 to 5 are ordinary code and constraints: they work the same with any model.</text>
</svg>
