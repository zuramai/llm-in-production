<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">The review bot: one pull request in, a few comments out</text>

  <!-- row 1 -->
  <rect x="20" y="60" width="150" height="80" rx="8" fill="#cfe3ff" stroke="#4a78b5"/>
  <text x="95" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#10243f">1. PR diff</text>
  <text x="95" y="112" text-anchor="middle" font-size="12" fill="#10243f">git diff base...head</text>
  <text x="95" y="128" text-anchor="middle" font-size="12" fill="#10243f">(5 context lines)</text>

  <rect x="205" y="60" width="170" height="80" rx="8" fill="#cfe3ff" stroke="#4a78b5"/>
  <text x="290" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#10243f">2. Parse + split</text>
  <text x="290" y="112" text-anchor="middle" font-size="12" fill="#10243f">files, hunks, 3 kinds of</text>
  <text x="290" y="128" text-anchor="middle" font-size="12" fill="#10243f">line number per line</text>

  <rect x="410" y="60" width="170" height="80" rx="8" fill="#ffe3a8" stroke="#b08a2a"/>
  <text x="495" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d2d00">3. LLM, per hunk</text>
  <text x="495" y="112" text-anchor="middle" font-size="12" fill="#3d2d00">strict JSON schema</text>
  <text x="495" y="128" text-anchor="middle" font-size="12" fill="#3d2d00">+ repo guidelines</text>

  <rect x="615" y="60" width="150" height="80" rx="8" fill="#d6f0d0" stroke="#4f8a45"/>
  <text x="690" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#173a12">4. Map lines</text>
  <text x="690" y="112" text-anchor="middle" font-size="12" fill="#173a12">snap onto changed</text>
  <text x="690" y="128" text-anchor="middle" font-size="12" fill="#173a12">lines or drop</text>

  <rect x="800" y="60" width="140" height="80" rx="8" fill="#d6f0d0" stroke="#4f8a45"/>
  <text x="870" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#173a12">5. Dedupe</text>
  <text x="870" y="112" text-anchor="middle" font-size="12" fill="#173a12">same file, nearby</text>
  <text x="870" y="128" text-anchor="middle" font-size="12" fill="#173a12">lines, same finding</text>

  <path d="M170,100 L203,100" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M375,100 L408,100" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M580,100 L613,100" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M765,100 L798,100" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- connector to row 2 -->
  <path d="M870,140 L870,190 L690,190 L690,205" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- row 2 -->
  <rect x="580" y="208" width="220" height="90" rx="8" fill="#f6c9c9" stroke="#b04a4a"/>
  <text x="690" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#400d0d">6. Confidence filter</text>
  <text x="690" y="258" text-anchor="middle" font-size="12" fill="#400d0d">drop below threshold,</text>
  <text x="690" y="274" text-anchor="middle" font-size="12" fill="#400d0d">cap at N comments</text>

  <path d="M580,253 L548,253" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="330" y="208" width="215" height="90" rx="8" fill="#e6d3f5" stroke="#7a4aa8"/>
  <text x="437" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a1040">7. GitHub review</text>
  <text x="437" y="258" text-anchor="middle" font-size="12" fill="#2a1040">event: COMMENT</text>
  <text x="437" y="274" text-anchor="middle" font-size="12" fill="#2a1040">never "request changes"</text>

  <rect x="40" y="208" width="240" height="90" rx="8" fill="#eeeeee" stroke="#888"/>
  <text x="160" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Eval (offline)</text>
  <text x="160" y="258" text-anchor="middle" font-size="12" fill="#222">8 planted bugs: recall</text>
  <text x="160" y="274" text-anchor="middle" font-size="12" fill="#222">unmatched comments: noise</text>
  <path d="M330,253 L282,253" stroke="#888" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
</svg>
