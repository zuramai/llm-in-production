[project]
name = "llm-in-production"
version = "0.1.0"
description = "Companion code for the open-source book 'LLM in Production'"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=3.46",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "httpx",
    "psycopg[binary]>=3.3",
    "pandas",
    "matplotlib",
    "jupyterlab>=4.6",
    "ipykernel",
    "rich",
    "tiktoken>=0.14",
    "faker>=40",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmprod"]

[dependency-groups]
dev = ["pytest>=9", "nbmake>=1.5", "ruff>=0.17", "playwright", "markdown-it-py>=3"]
ch01 = ["fastapi>=0.162", "uvicorn>=0.54", "sse-starlette>=3.6"]
ch06 = ["sqlglot>=30.30", "slack-bolt>=1.30", "pytest-timeout"]
ch02 = ["scikit-learn"]
ch03 = ["scikit-learn"]
ch04 = ["pgvector>=0.5", "sentence-transformers>=6.2"]
ch08 = ["pypdf", "reportlab", "pillow"]
ch09 = ["mcp>=2.3"]
ch11 = ["fastapi>=0.162", "uvicorn>=0.54", "prometheus-client"]
ch05 = ["langgraph>=1.2", "pgvector>=0.5", "sentence-transformers>=6.2", "sqlglot>=30.30"]
ch07 = ["sqlglot>=30.30"]
ch10 = ["langgraph>=1.2", "langgraph-checkpoint-postgres", "openai-agents>=0.24"]
ch14 = ["langfuse>=5.2"]
ch15 = ["redis", "pgvector>=0.5"]
ch20 = ["fastapi>=0.162", "uvicorn>=0.54", "sse-starlette>=3.6", "sqlglot>=30.30"]
ch21 = ["locust", "redis", "fastapi>=0.162", "uvicorn>=0.54"]

[tool.uv]
default-groups = "all"

[tool.pytest.ini_options]
markers = [
    "llm: calls a real model",
    "docker: needs docker services",
    "reseed: re-seeds the shared ShopFlow DB (drops chapter tables); opt in with -m reseed",
]
testpaths = ["datasets", "src", "ch01", "ch02", "ch03", "ch04", "ch05", "ch06", "ch07", "ch08", "ch09", "ch10", "ch11", "ch12", "ch13", "ch14", "ch15", "ch16", "ch17", "ch18", "ch19", "ch20", "ch21", "ch22"]
addopts = "-m 'not llm and not reseed'"

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb", "unsloth_compiled_cache"]
