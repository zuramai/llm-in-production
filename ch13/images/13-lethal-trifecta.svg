<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="600" rx="16" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">The lethal trifecta in ShopFlow's support assistant</text>
  <text x="480" y="66" text-anchor="middle" font-size="14" fill="#555">Any agent holding all three can be turned into an exfiltration tool (after Simon Willison, 2025)</text>

  <!-- three overlapping circles -->
  <circle cx="380" cy="270" r="150" fill="#7fb3e6" fill-opacity="0.55" stroke="#4a7fb5" stroke-width="2"/>
  <circle cx="580" cy="270" r="150" fill="#f2b880" fill-opacity="0.55" stroke="#c07a35" stroke-width="2"/>
  <circle cx="480" cy="420" r="150" fill="#9fd49a" fill-opacity="0.55" stroke="#4f9a49" stroke-width="2"/>

  <text x="300" y="215" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Private data</text>
  <text x="300" y="238" text-anchor="middle" font-size="13" fill="#1b2a3a">orders, names, emails</text>
  <text x="300" y="256" text-anchor="middle" font-size="13" fill="#1b2a3a">(get_order, search_orders,</text>
  <text x="300" y="274" text-anchor="middle" font-size="13" fill="#1b2a3a">SQL over customers)</text>

  <text x="660" y="215" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a2410">Untrusted content</text>
  <text x="660" y="238" text-anchor="middle" font-size="13" fill="#3a2410">ticket bodies, wiki pages,</text>
  <text x="660" y="256" text-anchor="middle" font-size="13" fill="#3a2410">the user's own message</text>
  <text x="660" y="274" text-anchor="middle" font-size="13" fill="#3a2410">(get_ticket, search_docs)</text>

  <text x="480" y="500" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d3a1a">External communication</text>
  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#1d3a1a">markdown images and links rendered</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#1d3a1a">in Slack / the help widget; create_refund</text>

  <circle cx="480" cy="320" r="34" fill="#d9534f" stroke="#8b2a27" stroke-width="2"/>
  <text x="480" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">data</text>
  <text x="480" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">leaves</text>

  <!-- defenses as cuts -->
  <g font-size="13" fill="#222">
    <rect x="20" y="90" width="210" height="96" rx="8" fill="#e8f0fa" stroke="#888"/>
    <text x="32" y="112" font-weight="bold">Shrink private data</text>
    <text x="32" y="132">narrower DB role (no names)</text>
    <text x="32" y="150">role allowlist: customers</text>
    <text x="32" y="168">never get order/email tools</text>

    <rect x="730" y="90" width="210" height="96" rx="8" fill="#fbefe3" stroke="#888"/>
    <text x="742" y="112" font-weight="bold">Contain untrusted content</text>
    <text x="742" y="132">input classifier (direct only)</text>
    <text x="742" y="150">provenance: ids from tickets</text>
    <text x="742" y="168">can't pick refund targets</text>

    <rect x="730" y="470" width="210" height="96" rx="8" fill="#e9f5e7" stroke="#888"/>
    <text x="742" y="492" font-weight="bold">Cut the outbound channel</text>
    <text x="742" y="512">strip images, HTML, and links</text>
    <text x="742" y="530">to non-allowlisted hosts</text>
    <text x="742" y="548">redact emails, phones, cards</text>
  </g>
  <line x1="230" y1="150" x2="290" y2="190" stroke="#888" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="730" y1="150" x2="670" y2="190" stroke="#888" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="730" y1="515" x2="630" y2="500" stroke="#888" stroke-width="2" stroke-dasharray="5,4"/>
</svg>
